name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Print toolchain
        run: |
          node -v
          npm -v

      - name: Clean stale lock / cache artifacts
        run: |
          rm -f pnpm-lock.yaml
          rm -f bun.lockb
          rm -rf node_modules
          npm cache clean --force || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline=false

      - name: Type check (src only)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build with Vite
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
          GITHUB_PAGES_BASE: "${{ github.event.repository.name }}"
          NODE_OPTIONS: "--no-warnings"
        run: |
          set -x
          node -e "console.log('node ok', process.version)"
          npx --no-install vite --version
          npx --no-install vite build --mode production 2>&1 | tee build.log
          test -d dist
          test -f dist/index.html
          echo "BUILD_OK"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verify build output
        run: |
          ls -la dist
          echo "--- dist/index.html ---"
          sed -n '1,40p' dist/index.html
          echo "--- dist/assets ---"
          ls -la dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
